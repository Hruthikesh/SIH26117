# Routing policy (SPEC §7.5): (role, modality, difficulty, context need) → ordered candidates.
# The router filters by capability/health first, then takes the first available candidate.
# The mock model is last everywhere: it only ever wins on GPU-less dev machines where no
# real engine is up, and never when YANTRA_SEALED=1 forbids degraded serving.

roles:
  router:        [qwen3.5-9b-fp8, qwen3.5-4b-gguf, qwen3.8-27b-int4, qwen3.5-0.8b-gguf, mock]
  utility:       [qwen3.5-9b-fp8, qwen3.5-4b-gguf, qwen3.5-0.8b-gguf, mock]
  planner:       [qwen3.8-27b-fp8, qwen3.8-27b, qwen3.8-27b-int4, qwen3.6-27b-fp8, qwen3.5-0.8b-gguf, mock]
  executor:      [qwen3.8-27b-fp8, qwen3.8-27b, qwen3.8-27b-int4, qwen3.6-27b-fp8, qwen3.5-0.8b-gguf, mock]
  reviewer:      [qwen3.8-27b-fp8, qwen3.8-27b, qwen3.8-27b-int4, qwen3.5-0.8b-gguf, mock]
  vision:        [qwen3.8-27b-fp8, qwen3.8-27b, qwen3.8-27b-int4, qwen3.5-9b-fp8, mock]
  ocr:           [paddleocr-vl-1.6, deepseek-ocr, mock]
  embed:         [qwen3-embedding-4b, qwen3-embedding-0.6b, qwen3-embedding-0.6b-gguf, mock]
  embed_visual:  [qwen3-vl-embedding-2b, mock]
  rerank:        [qwen3-reranker-0.6b, qwen3-reranker-0.6b-gguf, mock]
  rerank_visual: [qwen3-vl-reranker-2b, mock]
  heavy:         [mistral-small-4-119b, gpt-oss-120b, qwen3.8-27b-fp8, qwen3.8-27b, mock]

# Reasoning effort per stage (SPEC §7.3).
effort:
  planner: medium
  executor: low
  reviewer: medium
  router: low
  utility: low
  vision: medium
  heavy: high

# Applied by the Verifier one rung per failed attempt (SPEC §8.6), never silently.
escalation:
  - {action: raise_effort, to: high}
  - {action: best_of_n, n: 3, select_with: reviewer}
  - {action: switch_role, to: heavy}
  - {action: replan}

difficulty_signals: [task_role, has_images, input_tokens, num_files, code_or_prose, prior_failures]

# Difficulty classes from the utility classifier; hard starts one rung up the ladder.
difficulty:
  classes: [trivial, easy, normal, hard, extreme]
  start_rung: {trivial: 0, easy: 0, normal: 0, hard: 1, extreme: 2}
