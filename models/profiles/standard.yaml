# standard: one 80 GB GPU (A100/H100) or two 48 GB (L40S / RTX 6000 Ada), 128 GB RAM.
name: standard
description: Single 80 GB (or 2×48 GB) GPU; all serving models resident (~70 GB).
db: sqlite

config_defaults:
  context: {executor: 48000, planner: 48000, reviewer: 32000, utility: 8000}
  execution: {max_parallel_tasks: 3}
  knowledge: {ingest_workers: 2}
  budgets: {max_tokens: 400000, max_seconds: 3600}
  sandbox: {max_seconds: 180, max_rss_mb: 8192}

engines:
  - id: brain
    kind: vllm
    model: qwen3.8-27b-fp8
    device: cuda:0
    gpu_memory_utilization: 0.55
    max_model_len: 131072
    kv_cache_dtype: fp8
    enable_prefix_caching: true
  - id: utility
    kind: vllm
    model: qwen3.5-9b-fp8
    device: cuda:0
    gpu_memory_utilization: 0.15
    max_model_len: 65536
  - id: ocr
    kind: vllm
    model: paddleocr-vl-1.6
    device: cuda:0
    gpu_memory_utilization: 0.05
  - id: embed
    kind: pooling
    models: [qwen3-embedding-0.6b, qwen3-reranker-0.6b, qwen3-vl-embedding-2b, qwen3-vl-reranker-2b]
    device: cuda:0
    vram_fraction: 0.12

ingestion:
  workers: 2
  expected_pages_per_s: [1, 3]

concurrency:
  interactive_sessions: 8

measured: {}
